<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Devops - Labs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css"
    title="docsify-darklight-theme" type="text/css" />

  <style>
    /* ── Variables ───────────────────────────────────────────────── */
    :root {
      --font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      --card-radius: 8px;
    }

    /* ── Base ────────────────────────────────────────────────────── */
    body,
    .sidebar,
    .markdown-section {
      font-family: var(--font-family);
    }

    .markdown-section img {
      max-width: 65%;
      display: block;
      margin: 1rem 0;
    }

    .markdown-section p[align="center"],
    .markdown-section p[style*="text-align: center"] {
      text-align: left;
    }

    /* ── Layout ──────────────────────────────────────────────────── */
    .content {
      padding-top: 30px !important;
    }

    /* ── Headings ────────────────────────────────────────────────── */
    .markdown-section h1 {
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1.2;
      padding-bottom: 0.5rem;
      border-bottom: 3px solid var(--theme-color);
      margin-bottom: 1.25rem;
    }

    .markdown-section h2 {
      font-size: 1.1rem;
      font-weight: 700;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border-color, #e2e8f0);
      margin-top: 1.75rem;
      margin-bottom: 0.75rem;
    }

    .markdown-section h3 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .markdown-section h4 {
      font-size: 0.875rem;
      font-weight: 600;
      margin-top: 1.25rem;
      margin-bottom: 0.4rem;
    }

    /* ── Card grid ───────────────────────────────────────────────── */
    .module-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 0.85rem;
      margin: 1.25rem 0;
    }

    .module-card {
      display: block;
      padding: 0.9rem 1.1rem;
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: var(--card-radius);
      color: inherit !important;
      text-decoration: none !important;
      transition: box-shadow 0.2s, border-color 0.2s, transform 0.15s;
    }

    .module-card:hover {
      border-color: var(--theme-color);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }

    .module-card .card-tag {
      margin-bottom: 0.4rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--theme-color);
    }

    .module-card h3 {
      margin: 0 0 0.35rem;
      font-size: 1rem;
      font-weight: 600;
    }

    .module-card p {
      margin: 0;
      font-size: 0.83rem;
      line-height: 1.4;
      opacity: 0.65;
    }

    /* ── Sidebar ─────────────────────────────────────────────────── */
    .sidebar ul li a {
      font-size: 0.875rem;
    }

    .sidebar-nav > ul > li > a {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .sidebar-nav ul li a {
      display: block;
      padding: 4px 8px;
      margin-right: 8px;
      border-radius: 6px;
      text-decoration: none !important;
      transition: background 0.15s, color 0.15s;
    }

    .sidebar-nav ul li a:hover {
      background: rgba(0, 0, 0, 0.05);
      font-weight: 600;
    }

    /* ── Theme overrides ─────────────────────────────────────────── */
    html[style*="color-scheme: dark"] .logo img,
    html[style*="color-scheme: dark"] .markdown-section img[src*="ortLogo_dark"] {
      content: url('Extras/Imagenes/ortLogo_white.svg');
    }

    html[style*="color-scheme: light"] .logo img {
      content: url('Extras/Imagenes/ortLogo_dark.svg');
    }

    html[style*="color-scheme: dark"] .sidebar {
      background-color: #1e293b !important;
      border-right: 1px solid #334155 !important;
    }

    .sidebar-nav ul li.active,
    .sidebar-nav ul li.active > a,
    .sidebar-nav ul li a.active {
      border-right: none !important;
    }

    .sidebar-nav ul li.active > a,
    .sidebar-nav ul li a.active {
      font-weight: 700 !important;
    }

    html[style*="color-scheme: light"] .sidebar-nav ul li.active > a,
    html[style*="color-scheme: light"] .sidebar-nav ul li a.active {
      background: #e0f2fe;
      color: #0369a1 !important;
    }

    html[style*="color-scheme: dark"] .sidebar-nav ul li.active > a,
    html[style*="color-scheme: dark"] .sidebar-nav ul li a.active {
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8 !important;
    }

    html[style*="color-scheme: dark"] .sidebar-nav ul li a:hover {
      background: rgba(255, 255, 255, 0.05);
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script>
    /*
    ── Paleta personalizada — PASO 2 de 2 ──────────────────────────
    Reemplazar la línea `// darklightTheme: ...` de abajo por este bloque:

    darklightTheme: {
      defaultTheme: 'dark',
      dark: {
        background:          '#1e1b2e',
        toogleBackground:    '#44475a',
        textColor:           '#f8f8f2',
        accent:              '#71e1d1',
        highlightColor:      '#71e1d1',
        sidebarSublink:      '#8a7adb',
        codeTextColor:       '#f8f8f2',
        codeBackgroundColor: '#1a1926',
        codeTypeColor:       '#ff80bf',
        borderColor:         '#7970a9',
        blockQuoteColor:     '#7970a9',
      },
      light: {
        background:          '#f8f8f2',
        toogleBackground:    '#282a36',
        textColor:           '#282a36',
        accent:              '#7c6fcd',
        highlightColor:      '#7c6fcd',
        sidebarSublink:      '#6272a4',
        codeTextColor:       '#282a36',
        codeBackgroundColor: '#e4e2f0',
        codeTypeColor:       '#6272a4',
        borderColor:         '#d0cee8',
        blockQuoteColor:     '#6272a4',
      },
    },
    ─────────────────────────────────────────────────────────────── */

    window.$docsify = {
      name: 'DevOps - Labs',
      repo: '',
      loadSidebar: true,
      darklightTheme: {
        defaultTheme: 'light',
        dark: {
          background:          '#0f172a',
          toogleBackground:    '#1e293b',
          textColor:           '#e2e8f0',
          accent:              '#38bdf8',
          highlightColor:      '#38bdf8',
          sidebarSublink:      '#94a3b8',
          codeTextColor:       '#e2e8f0',
          codeBackgroundColor: '#1e293b',
          codeTypeColor:       '#7dd3fc',
          borderColor:         '#334155',
          blockQuoteColor:     '#64748b',
        },
        light: {
          background:          '#f8fafc',
          toogleBackground:    '#1e293b',
          textColor:           '#0f172a',
          accent:              '#0369a1',
          highlightColor:      '#0369a1',
          sidebarSublink:      '#475569',
          codeTextColor:       '#0f172a',
          codeBackgroundColor: '#f1f5f9',
          codeTypeColor:       '#0284c7',
          borderColor:         '#e2e8f0',
          blockQuoteColor:     '#64748b',
        },
      },
      relativePath: true,
      auto2top: true,
      alias: {
        '/.*/_sidebar.md': './_sidebar.md'
      },
      plugins: [
        function(hook, vm) {
          hook.beforeEach(function(content) {
            if (window.location.hostname.includes('github.io')) {
              content = content.replace(/src="\/Extras\//g,'src="Extras/');
            }
            return content;
          });
        }
      ],
      copyCode: {
        buttonText: 'Copy to clipboard',
        errorText: 'Error',
        successText: 'Copied!'
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js" type="text/javascript"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code"></script>
  <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@latest/dist/docsify-mermaid.js"></script>
  <script>
    const mermaidThemes = {
      dark: {
        startOnLoad: false,
        theme: 'base',
        themeVariables: {
          background:          '#0f172a',
          mainBkg:             '#1e293b',
          primaryColor:        '#1e293b',
          primaryTextColor:    '#e2e8f0',
          primaryBorderColor:  '#38bdf8',
          lineColor:           '#475569',
          secondaryColor:      '#0f172a',
          edgeLabelBackground: '#1e293b',
          clusterBkg:          '#1e293b',
          nodeTextColor:       '#e2e8f0',
        }
      },
      light: {
        startOnLoad: false,
        theme: 'base',
        themeVariables: {
          background:          '#f8fafc',
          mainBkg:             '#f1f5f9',
          primaryColor:        '#f1f5f9',
          primaryTextColor:    '#0f172a',
          primaryBorderColor:  '#0369a1',
          lineColor:           '#64748b',
          secondaryColor:      '#e2e8f0',
          edgeLabelBackground: '#f8fafc',
          clusterBkg:          '#e2e8f0',
          nodeTextColor:       '#0f172a',
        }
      }
    };

    function getMermaidTheme() {
      return (document.documentElement.getAttribute('style') || '').includes('color-scheme: dark') ? 'dark' : 'light';
    }

    mermaid.initialize(mermaidThemes[getMermaidTheme()]);

    // Guardar el source original antes de que mermaid lo reemplace con SVG
    document.addEventListener('DOMContentLoaded', () => {
      new MutationObserver(mutations => {
        mutations.forEach(({ addedNodes }) => {
          addedNodes.forEach(node => {
            if (node.nodeType !== 1) return;
            const els = node.classList?.contains('mermaid')
              ? [node]
              : [...(node.querySelectorAll?.('.mermaid') ?? [])];
            els.forEach(el => { if (!el.dataset.source) el.dataset.source = el.textContent.trim(); });
          });
        });
      }).observe(document.body, { childList: true, subtree: true });
    });

    // Re-renderizar diagramas al cambiar el tema
    new MutationObserver(() => {
      mermaid.initialize(mermaidThemes[getMermaidTheme()]);
      const diagrams = [...document.querySelectorAll('.mermaid')];
      if (!diagrams.length) return;
      diagrams.forEach(el => {
        if (el.dataset.source) {
          el.innerHTML = el.dataset.source;
          el.removeAttribute('data-processed');
        }
      });
      mermaid.run({ nodes: diagrams }).catch(() => {});
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });
  </script>
  </body>

</html>
